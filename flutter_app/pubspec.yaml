name: tzmc_push
description: TZMC Push Messaging App - Flutter mobile client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6
  intl: ">=0.19.0 <0.21.0"

  # State Management
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2

  # Networking
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  retrofit: ^4.6.0
  # connectivity_plus 7.1.0+ references NWPath.isUltraConstrained in iOS code,
  # which fails to compile on the current CI Xcode SDK. Keep below 7.1.0.
  connectivity_plus: ^7.3.1

  # Local Storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.6.0+eol
  # drift_flutter 0.2.8+ pulls drift 2.30+, which forces drift_dev onto
  # source_gen 3.x; keep below that threshold.
  drift_flutter: ^0.3.1  # Cross-platform database support (includes web)
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.0.0
  path: ^1.8.3

  # Realtime
  socket_io_client: ^3.1.6
  web_socket_channel: ^3.0.1

  # Push Notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^22.3.0

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Utilities
  json_annotation: ^4.8.1
  # Flutter CI runs on Flutter 3.27.4 / Dart 3.6.2, so keep freezed on the
  # last range that does not pull in Dart >=3.7 build dependencies.
  freezed_annotation: ^3.1.0
  equatable: ^2.0.5
  collection: ^1.18.0
  path_provider: ^2.1.2
  logger: ^2.0.2+1
  permission_handler: ^13.0.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.0
  file_picker: ^12.0.0
  open_filex: ^4.7.0

  # UI
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  # Web browser APIs for the web-platform file-picker shim.
  web: ^1.1.1

# Pin transitive Flutter plugin Android modules to versions whose buildscript
# uses the Kotlin Gradle plugin 2.1.0 (matching `android/settings.gradle.kts`).
# Newer releases of `shared_preferences_android` (>=2.4.19) require the
# Kotlin Gradle plugin 2.3.0, which forces Gradle to download new Kotlin
# plugin artifacts from Maven Central. That download fails on networks where
# the JDK truststore cannot validate the Maven Central TLS certificate
# (PKIX path building / SSL handshake errors). Pinning to 2.4.2 keeps the
# build on the already-resolved Kotlin 2.1.0 toolchain and avoids the
# additional artifact downloads.
dependency_overrides:
  shared_preferences_android: 2.4.2
  # This app has no @RestApi-annotated classes, so retrofit_generator produces
  # no output.  Every published retrofit_generator version either requires
  # build ^2.5.4 (incompatible with build_runner 2.4.x on Dart 3.6) or has
  # analyzer compatibility issues.  The local stub at
  # tools/retrofit_generator_stub has no build.yaml and therefore registers no
  # builders; build_runner compiles a clean entrypoint and only Drift / freezed
  # / json_serializable codegen runs.
  retrofit_generator:
    path: ./tools/retrofit_generator_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.0  # or ^9.6.0+ if using latest major
  drift_dev: ^2.20.0
  freezed: ^4.0.0             # or ^3.0.0 if using freezed v3
  mockito: ^5.4.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
        - asset: assets/fonts/Heebo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
