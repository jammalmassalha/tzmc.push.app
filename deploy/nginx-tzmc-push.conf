# nginx site config for the TZMC Push App on AWS EC2.
#
# Install:
#   sudo cp deploy/nginx-tzmc-push.conf /etc/nginx/sites-available/tzmc-push
#   sudo ln -s /etc/nginx/sites-available/tzmc-push /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain certificates (certbot rewrites the listen/ssl lines for you):
#   sudo certbot --nginx -d tzmc.co.il -d www.tzmc.co.il
#
# KEY POINTS FOR THIS APP:
#  * Every route is registered twice in server.js — once at `/x` and once at
#    `/notify/x`. The app owns the `/notify` prefix itself, so NEVER rewrite or
#    strip the path here. `proxy_pass http://tzmc_backend;` (no trailing URI)
#    passes the original path through unchanged.
#  * Socket.IO is served at `/notify/socket.io` and needs the HTTP/1.1 upgrade
#    headers plus a long read timeout.
#  * TRUST_PROXY=1 must be set in the app's .env so req.ip and the per-user
#    rate limiters see the real client IP from X-Forwarded-For.

upstream tzmc_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Socket.IO / WebSocket upgrade mapping. `map` must live at the http{} level;
# if you place this file in sites-enabled (included from http{}), this is fine.
# If nginx complains about a duplicate `$connection_upgrade`, it is already
# defined elsewhere — delete this block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (certbot needs /.well-known to stay on port 80)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tzmc.co.il www.tzmc.co.il;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS reverse proxy
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tzmc.co.il www.tzmc.co.il;

    # Managed by certbot after `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/tzmc.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tzmc.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # server.js accepts JSON/urlencoded bodies up to 350mb and proxies uploads
    # through the security-scanning path. Keep this at or above that limit, and
    # lower both together if you want stricter upload caps.
    client_max_body_size 350m;
    client_body_timeout  300s;

    # MUST stay below the app's HTTP_KEEP_ALIVE_TIMEOUT_MS (default 65000ms),
    # otherwise idle keep-alive connections race and surface as ECONNRESET.
    keepalive_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Realtime: Socket.IO handshake + WebSocket frames.
    location /notify/socket.io/ {
        proxy_pass http://tzmc_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Server-Sent Events fallback transport — buffering must be off or events
    # are held back by nginx.
    location = /notify/stream {
        proxy_pass http://tzmc_backend;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else: `/`, `/notify/*`, `/fluttertest/*`, `/uploads/*`.
    # No trailing URI on proxy_pass => the original path is forwarded verbatim.
    location / {
        proxy_pass http://tzmc_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
